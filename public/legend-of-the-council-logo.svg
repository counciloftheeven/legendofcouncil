<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480">
  <defs>
    <!-- Background Gradient for standalone usage -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Ultra High-Fidelity Chiseled Gold Sheen -->
    <linearGradient id="councilGoldUltra" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="5%" stop-color="#fff8db" />
      <stop offset="14%" stop-color="#fde398" />
      <stop offset="28%" stop-color="#eec366" />
      <stop offset="48%" stop-color="#cb9b3b" />
      <stop offset="68%" stop-color="#9a6c1e" />
      <stop offset="85%" stop-color="#64410f" />
      <stop offset="96%" stop-color="#3b2406" />
      <stop offset="100%" stop-color="#1f1102" />
    </linearGradient>

    <!-- Secondary Bevel Mid-Tone (Simulates angular 3D chiseled light reflection) -->
    <linearGradient id="councilGoldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2e0a" />
      <stop offset="25%" stop-color="#875c1c" />
      <stop offset="50%" stop-color="#d8ab48" />
      <stop offset="75%" stop-color="#fde49d" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Deep 3D Underlay Extrusion Gradient -->
    <linearGradient id="councilExtrudeShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b1a08" />
      <stop offset="50%" stop-color="#150c04" />
      <stop offset="100%" stop-color="#080401" />
    </linearGradient>

    <!-- Specular Highlight Rim Stroke Gradient -->
    <linearGradient id="councilSpecularEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#fff3c6" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#e5be5e" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#6f4912" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#180e03" stop-opacity="0.95" />
    </linearGradient>

    <!-- Ambient Center Golden Radiance -->
    <radialGradient id="councilCenterGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#b38728" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#5c3c0a" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Radiant Glint Star -->
    <g id="councilGlintStar">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#councilGoldUltra)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </defs>

  <!-- Ambient Glow -->
  <rect width="100%" height="100%" fill="url(#councilCenterGlow)" />

